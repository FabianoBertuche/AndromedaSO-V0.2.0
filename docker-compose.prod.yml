services:
  postgres:
    image: postgres:16
    container_name: andromeda-postgres-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: andromeda
      POSTGRES_PASSWORD: prodkey
      POSTGRES_DB: andromeda
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andromeda -d andromeda"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: andromeda-redis-prod
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kernel:
    build:
      context: ./core/kernel
      dockerfile: Dockerfile
    container_name: andromeda-kernel-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://andromeda:prodkey@postgres:5432/andromeda
      REDIS_URL: redis://redis:6379
      PROVIDER_REPOSITORY_MODE: postgres
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: andromeda-frontend-prod
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      kernel:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
