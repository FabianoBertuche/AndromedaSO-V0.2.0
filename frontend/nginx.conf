server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://kernel:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /status {
    proxy_pass http://kernel:4000/status;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /agents/ {
    proxy_pass http://kernel:4000/agents/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /dashboard/ {
    proxy_pass http://kernel:4000/dashboard/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /tasks/ {
    proxy_pass http://kernel:4000/tasks/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /eval/ {
    proxy_pass http://kernel:4000/eval/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /orchestrator/ {
    proxy_pass http://kernel:4000/orchestrator/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
    proxy_buffering off;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
